name: Release

# Automatically creates a GitHub release when a v* tag is pushed, or via
# manual dispatch with a tag name (the tag is then created on the fly).
# The release notes are taken from RELEASE.md (update it before tagging).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.9.0); created if it does not exist'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag (without the leading v) must match web/VERSION, which the app
      # reports and the updater compares against the latest release.
      - name: Check tag matches web/VERSION
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < web/VERSION)"
          tag_version="${TAG#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error file=web/VERSION::Tag '$TAG' does not match web/VERSION ('$version'). Bump web/VERSION or fix the tag."
            exit 1
          fi
          echo "Tag $TAG matches web/VERSION $version"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE.md

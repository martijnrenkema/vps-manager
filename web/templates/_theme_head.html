{# Shared <head> fragment (base.html + login.html): theme bootstrap.
   Runs before the first paint so a light-theme user never sees a dark flash.
   Stored choice ("light"/"dark") wins; without one we follow the OS. #}
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14161a">
<script>
(function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('vpsm-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    d.setAttribute('data-theme', t);
    d.setAttribute('data-bs-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#f4f5f7' : '#14161a');
})();
</script>
